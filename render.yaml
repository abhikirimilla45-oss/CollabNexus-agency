services:
  - type: web
    name: collabnexus
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: CN_PROFILE
        value: "mysql,prod"
      - key: CN_DEMO_DATA
        value: "true"
      - key: CN_UPLOAD_DIR
        value: /app/uploads
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
