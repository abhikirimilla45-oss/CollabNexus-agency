spring.datasource.url=jdbc:h2:mem:collabnexus;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false

spring.h2.console.enabled=false
spring.web.resources.cache.cachecontrol.no-store=true

management.endpoints.web.exposure.include=health,info

logging.level.root=WARN
logging.level.com.collabnexus=INFO

cn.demo-data.enabled=false
cn.security.rate-limit.enabled=false
cn.uploads.dir=${java.io.tmpdir}/collabnexus-test-uploads
