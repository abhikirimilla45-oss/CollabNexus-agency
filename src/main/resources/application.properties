spring.application.name=CollabNexus
spring.profiles.active=${CN_PROFILE:local}

server.port=${PORT:${SERVER_PORT:8080}}
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=framework

spring.datasource.url=jdbc:h2:file:${CN_DATA_DIR:./data}/collabnexus
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/{vendor}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

cn.demo-data.enabled=${CN_DEMO_DATA:true}
cn.security.rate-limit.enabled=${CN_RATE_LIMIT:true}

spring.servlet.multipart.max-file-size=${CN_UPLOAD_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${CN_UPLOAD_MAX_REQUEST_SIZE:12MB}

cn.uploads.dir=${CN_UPLOAD_DIR:./uploads}
cn.uploads.max-bytes=${CN_UPLOAD_MAX_BYTES:10485760}

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true

info.app.name=CollabNexus
info.app.version=@project.version@
info.app.phase=Phase 10 - Production readiness

spring.web.resources.cache.cachecontrol.max-age=3600
